<!doctype html><html lang="en"><head><meta charset="utf-8"><title>nuggets — clickable prototype</title>
<script>window.NUG_ASSET_BASE='../assets/';</script>
<link rel="stylesheet" href="../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="https://unpkg.com/lucide@0.462.0/dist/umd/lucide.min.js"></script>
<script src="../_ds_bundle.js"></script>
<script type="text/babel" src="ios-frame.jsx"></script>
<script type="text/babel" src="browser-window.jsx"></script>
<style>html,body{margin:0;background:var(--nug-cream-200);min-height:100vh}</style>
</head><body>
<div id="root"></div>
<script type="text/babel">
const { Wordmark, Button, Badge } = window.NuggetsDesignSystem_33854b;
const SURFACES = [
  { id: 'site', label: 'Marketing site', src: '../ui_kits/marketing_site/index.html', url: 'nuggets.local', w: 1180, h: 720, note: 'Speculative — no marketing site exists in the repo.' },
  { id: 'app', label: 'Desktop app', src: '../ui_kits/web_app/index.html', url: '127.0.0.1:7777', w: 1180, h: 720, note: 'The MVP: one screen, two dialogs, archive and a random draw.' },
  { id: 'phone', label: 'Phone', src: '../ui_kits/mobile_app/index.html', w: 390, h: 844, note: 'Speculative — the responsive pass behind spec §9.1 (over the tailnet).' },
];
function Proto() {
  const [id, setId] = React.useState('app');
  const [avail, setAvail] = React.useState({ w: 1200, h: 900 });
  const s = SURFACES.find(x => x.id === id);
  React.useEffect(() => { if (window.lucide) window.lucide.createIcons({ attrs: { 'stroke-width': 2.2 } }); });
  React.useEffect(() => {
    const fit = () => setAvail({ w: window.innerWidth - 48, h: window.innerHeight - 190 });
    fit(); window.addEventListener('resize', fit); return () => window.removeEventListener('resize', fit);
  }, []);
  const natural = id === 'phone' ? { w: 400, h: 880 } : { w: s.w, h: s.h + 84 };
  const scale = Math.min(1, avail.w / natural.w, avail.h / natural.h);
  const frame = <iframe key={s.id} src={s.src} title={s.label} style={{ width: '100%', height: '100%', border: 'none', display: 'block', background: 'var(--surface-page)' }} />;
  return (
    <div style={{ minHeight: '100vh', display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 22, padding: '26px 24px 56px' }}>
      <header style={{ width: '100%', maxWidth: 1180, display: 'flex', alignItems: 'center', gap: 16 }}>
        <Wordmark size={22} />
        <Badge tone="golden">Clickable prototype</Badge>
        <span style={{ flex: 1 }} />
        <div role="tablist" style={{ display: 'inline-flex', gap: 4, padding: 4, background: 'var(--nug-cream-50)', border: 'var(--border-regular) solid var(--nug-ink-200)', borderRadius: 'var(--radius-pill)' }}>
          {SURFACES.map(x => (
            <button key={x.id} type="button" role="tab" aria-selected={x.id === id} onClick={() => setId(x.id)}
              style={{ height: 34, padding: '0 18px', border: 'none', borderRadius: 'var(--radius-pill)', cursor: 'pointer',
                background: x.id === id ? 'var(--nug-golden-400)' : 'transparent',
                boxShadow: x.id === id ? '0 2px 0 var(--nug-golden-600)' : 'none',
                fontFamily: 'var(--font-display)', fontWeight: 'var(--weight-bold)', fontSize: 'var(--text-body-sm)',
                color: x.id === id ? 'var(--nug-ink-900)' : 'var(--nug-ink-500)', transition: 'all var(--dur-fast) var(--ease-out)' }}>{x.label}</button>
          ))}
        </div>
      </header>
      <p style={{ margin: 0, fontSize: 'var(--text-body-sm)', color: 'var(--nug-ink-500)', maxWidth: 640, textAlign: 'center', textWrap: 'pretty' }}>{s.note}</p>
      <div style={{ width: natural.w * scale, height: natural.h * scale }}>
        <div style={{ width: natural.w, height: natural.h, transform: `scale(${scale})`, transformOrigin: 'top left', display: 'flex', justifyContent: 'center' }}>
          {id === 'phone'
            ? <window.IOSDevice title=""><div style={{ position: 'absolute', inset: 0 }}>{frame}</div></window.IOSDevice>
            : <window.ChromeWindow width={s.w} height={s.h} url={s.url}>{frame}</window.ChromeWindow>}
        </div>
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<Proto />);
</script>
</body></html>
