<!-- @dsCard group="Shape" viewport="700x150" name="Corner radii" subtitle="6 → 28px, plus pill" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>html,body{margin:0;background:var(--nug-cream-50)}.c{padding:18px 20px;font-family:var(--font-body);color:var(--text-body)}</style></head><body><div class="c"><div style="display:flex;gap:12px"><div style="flex:1;text-align:center"><div style="height:62px;background:var(--nug-golden-200);border:1.5px solid var(--nug-golden-600);border-radius:var(--radius-xs)"></div><div style="margin-top:6px;font-family:var(--font-mono);font-size:10.5px">xs</div><div style="font-family:var(--font-mono);font-size:10px;color:var(--nug-ink-500)">6px</div></div><div style="flex:1;text-align:center"><div style="height:62px;background:var(--nug-golden-200);border:1.5px solid var(--nug-golden-600);border-radius:var(--radius-sm)"></div><div style="margin-top:6px;font-family:var(--font-mono);font-size:10.5px">sm</div><div style="font-family:var(--font-mono);font-size:10px;color:var(--nug-ink-500)">10px</div></div><div style="flex:1;text-align:center"><div style="height:62px;background:var(--nug-golden-200);border:1.5px solid var(--nug-golden-600);border-radius:var(--radius-md)"></div><div style="margin-top:6px;font-family:var(--font-mono);font-size:10.5px">md</div><div style="font-family:var(--font-mono);font-size:10px;color:var(--nug-ink-500)">14px</div></div><div style="flex:1;text-align:center"><div style="height:62px;background:var(--nug-golden-200);border:1.5px solid var(--nug-golden-600);border-radius:var(--radius-lg)"></div><div style="margin-top:6px;font-family:var(--font-mono);font-size:10.5px">lg</div><div style="font-family:var(--font-mono);font-size:10px;color:var(--nug-ink-500)">20px</div></div><div style="flex:1;text-align:center"><div style="height:62px;background:var(--nug-golden-200);border:1.5px solid var(--nug-golden-600);border-radius:var(--radius-xl)"></div><div style="margin-top:6px;font-family:var(--font-mono);font-size:10.5px">xl</div><div style="font-family:var(--font-mono);font-size:10px;color:var(--nug-ink-500)">28px</div></div><div style="flex:1;text-align:center"><div style="height:62px;background:var(--nug-golden-200);border:1.5px solid var(--nug-golden-600);border-radius:var(--radius-pill)"></div><div style="margin-top:6px;font-family:var(--font-mono);font-size:10.5px">pill</div><div style="font-family:var(--font-mono);font-size:10px;color:var(--nug-ink-500)">999px</div></div></div>
<div style="margin-top:9px;font-size:12px;color:var(--nug-ink-500)">Inputs 14px, cards 20px, modals 28px, every button and chip is a pill.</div></div></body></html>
