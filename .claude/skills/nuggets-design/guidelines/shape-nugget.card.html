<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>html,body{margin:0;background:var(--nug-cream-50)}.c{padding:18px 20px;font-family:var(--font-body);color:var(--text-body)}</style></head><body><div class="c"><div style="display:flex;gap:16px;align-items:center">

<div style="width:96px;height:80px;background:var(--nug-golden-300);border:2px solid var(--nug-golden-700);border-radius:var(--radius-nugget-alt)"></div>

</div></div></body></html>
