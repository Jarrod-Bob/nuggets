<!-- @dsCard group="Colors" viewport="700x150" name="Semantic roles" subtitle="Aliases to reach for instead of raw ramp values" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>html,body{margin:0;background:var(--nug-cream-50)}.c{padding:18px 20px;font-family:var(--font-body);color:var(--text-body)}</style></head><body><div class="c"><div style="display:grid;grid-template-columns:repeat(4,1fr);gap:10px"><div style="background:var(--surface-page);border:1.5px solid var(--nug-ink-200);border-radius:var(--radius-md);padding:10px 11px;height:54px;display:flex;align-items:flex-end"><span style="font-family:var(--font-mono);font-size:10.5px;color:var(--nug-ink-900)">--surface-page</span></div><div style="background:var(--surface-card);border:1.5px solid var(--nug-ink-200);border-radius:var(--radius-md);padding:10px 11px;height:54px;display:flex;align-items:flex-end"><span style="font-family:var(--font-mono);font-size:10.5px;color:var(--nug-ink-900)">--surface-card</span></div><div style="background:var(--surface-sunken);border:1.5px solid var(--nug-ink-200);border-radius:var(--radius-md);padding:10px 11px;height:54px;display:flex;align-items:flex-end"><span style="font-family:var(--font-mono);font-size:10.5px;color:var(--nug-ink-900)">--surface-sunken</span></div><div style="background:var(--surface-inverse);border:1.5px solid var(--nug-ink-200);border-radius:var(--radius-md);padding:10px 11px;height:54px;display:flex;align-items:flex-end"><span style="font-family:var(--font-mono);font-size:10.5px;color:var(--nug-cream-50)">--surface-inverse</span></div><div style="background:var(--accent);border:1.5px solid var(--nug-ink-200);border-radius:var(--radius-md);padding:10px 11px;height:54px;display:flex;align-items:flex-end"><span style="font-family:var(--font-mono);font-size:10.5px;color:var(--nug-ink-900)">--accent</span></div><div style="background:var(--danger);border:1.5px solid var(--nug-ink-200);border-radius:var(--radius-md);padding:10px 11px;height:54px;display:flex;align-items:flex-end"><span style="font-family:var(--font-mono);font-size:10.5px;color:var(--nug-cream-50)">--danger</span></div><div style="background:var(--success);border:1.5px solid var(--nug-ink-200);border-radius:var(--radius-md);padding:10px 11px;height:54px;display:flex;align-items:flex-end"><span style="font-family:var(--font-mono);font-size:10.5px;color:var(--nug-cream-50)">--success</span></div><div style="background:var(--warning);border:1.5px solid var(--nug-ink-200);border-radius:var(--radius-md);padding:10px 11px;height:54px;display:flex;align-items:flex-end"><span style="font-family:var(--font-mono);font-size:10.5px;color:var(--nug-ink-900)">--warning</span></div></div></div></body></html>
