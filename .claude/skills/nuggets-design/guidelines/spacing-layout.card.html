<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>html,body{margin:0;background:var(--nug-cream-50)}.c{padding:18px 20px;font-family:var(--font-body);color:var(--text-body)}</style></head><body><div class="c"><div style="display:grid;grid-template-columns:repeat(4,1fr);gap:10px;font-family:var(--font-mono);font-size:11.5px"><div style="background:var(--nug-cream-200);border-radius:var(--radius-sm);padding:9px 10px"><div>--gutter-mobile</div><div style="color:var(--nug-ink-500)">16px</div></div><div style="background:var(--nug-cream-200);border-radius:var(--radius-sm);padding:9px 10px"><div>--gutter-web</div><div style="color:var(--nug-ink-500)">24px</div></div><div style="background:var(--nug-cream-200);border-radius:var(--radius-sm);padding:9px 10px"><div>--gutter-marketing</div><div style="color:var(--nug-ink-500)">32px</div></div><div style="background:var(--nug-cream-200);border-radius:var(--radius-sm);padding:9px 10px"><div>--page-max</div><div style="color:var(--nug-ink-500)">1200px</div></div><div style="background:var(--nug-cream-200);border-radius:var(--radius-sm);padding:9px 10px"><div>--sidenav-w</div><div style="color:var(--nug-ink-500)">248px</div></div><div style="background:var(--nug-cream-200);border-radius:var(--radius-sm);padding:9px 10px"><div>--topbar-h</div><div style="color:var(--nug-ink-500)">60px</div></div><div style="background:var(--nug-cream-200);border-radius:var(--radius-sm);padding:9px 10px"><div>--tabbar-h</div><div style="color:var(--nug-ink-500)">64px</div></div><div style="background:var(--nug-cream-200);border-radius:var(--radius-sm);padding:9px 10px"><div>--hit-min</div><div style="color:var(--nug-ink-500)">44px</div></div></div></div></body></html>
