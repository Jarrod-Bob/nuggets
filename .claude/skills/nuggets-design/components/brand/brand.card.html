<!doctype html><html><head><meta charset="utf-8"><script>window.NUG_ASSET_BASE='../../assets/';</script><link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel">

</div></div>
<div><p className="lbl">Icon mark — single nugget, for tight spaces (favicon, avatar)</p><div className="row" style={{gap:22}}>
<Wordmark iconOnly size={28}/><Wordmark iconOnly size={44}/><Wordmark iconOnly size={64}/>
</div></div>
<div><p className="lbl">NuggetMark — decorative motif, plain and bitten</p><div className="row" style={{gap:22}}>
<NuggetMark variant="single" size={64}/><NuggetMark variant="single" size={64} bitten/><NuggetMark variant="trio" size={150}/><NuggetMark variant="trio" size={150} bitten/><NuggetMark variant="dip" size={58}/><NuggetMark variant="bucket" size={80}/>
