<!doctype html>
<html>
<head><meta charset="utf-8"><title>Field — preview</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bangers&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Instrument+Sans:wght@400;600;700&family=Space+Mono:wght@400;700&display=swap">
<style>body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--font-body)}</style>
</head>
<body>
<div id="root"></div>
<script>
  var C = window.Comic, h = React.createElement;
  ReactDOM.createRoot(document.getElementById('root')).render(h('div',{style:{display:'grid',gridTemplateColumns:'1fr 1fr',gap:20,padding:20}},h(C.Field,{label:'Title',placeholder:'What is it, in a line?',defaultValue:'Commit messages as haiku'}),h(C.Field,{label:'Title',placeholder:'What is it, in a line?',hint:'A nugget needs a title.'}),h(C.Field,{label:'Notes',multiline:true,defaultValue:'Five, seven, five. The linter counts syllables.',style:{gridColumn:'1 / -1'}})));
</script>
</body>
</html>
